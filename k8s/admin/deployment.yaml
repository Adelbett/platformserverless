# Admin console, exposed via NodePort (fixed port 30081 on every cluster
# node) rather than the public MetalLB LoadBalancer pool used by
# platform-web — reachable at http://<any-node-ip>:30081, still cluster
# -network-only, not a public internet-facing IP. Chosen over ClusterIP for
# ease of access during this phase; revisit when a real internal VPN/ingress
# is in place for a tighter boundary.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-admin
  namespace: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: platform-admin
  template:
    metadata:
      labels:
        app: platform-admin
    spec:
      containers:
      - name: platform-admin
        image: adelbettaieb/platform-admin:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: platform-admin
  namespace: platform
spec:
  type: NodePort
  selector:
    app: platform-admin
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30081
