# Internal-only admin console. Deliberately NOT type: LoadBalancer (would
# expose it on the public MetalLB pool, 10.9.21.231) and NOT routed through
# Kourier/Knative — this is a plain Deployment/Service pair reachable only
# from inside the cluster (kubectl port-forward, or a future internal
# VPN/ingress once the client/admin network split lands).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-admin
  namespace: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: platform-admin
  template:
    metadata:
      labels:
        app: platform-admin
    spec:
      containers:
      - name: platform-admin
        image: adelbettaieb/platform-admin:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: platform-admin
  namespace: platform
spec:
  type: ClusterIP
  selector:
    app: platform-admin
  ports:
  - port: 80
    targetPort: 80
