# Template — copy to backup-secret.yaml, fill in real values, and apply.
# Never commit the filled-in version. Works with any S3-compatible
# provider (AWS S3, MinIO, OVH, Scaleway, Backblaze B2, ...) via
# AWS_ENDPOINT_URL.
apiVersion: v1
kind: Secret
metadata:
  name: backup-s3-credentials
  namespace: platform
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: "REPLACE_ME"
  AWS_SECRET_ACCESS_KEY: "REPLACE_ME"
  AWS_ENDPOINT_URL: "https://s3.REPLACE_ME.example.com"
  BACKUP_BUCKET: "platformserverless-backups"
