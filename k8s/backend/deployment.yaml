apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-api
  namespace: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: platform-api
  template:
    metadata:
      labels:
        app: platform-api
    spec:
      containers:
      - name: platform-api
        image: adelbettaieb/platform-api:latest
        ports:
        - containerPort: 8082
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "k8s"
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:postgresql://postgres.platform.svc.cluster.local:5432/platformserverless"
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: platform-api-secrets
              key: postgres-username
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: platform-api-secrets
              key: postgres-password
        - name: KEYCLOAK_ISSUER_URI
          # Must match the "iss" claim Keycloak actually stamps on tokens,
          # which is the public-facing URL the browser used to reach it
          # (VITE_KEYCLOAK_URL in the frontend .env), NOT the in-cluster
          # DNS name — Spring's JWT issuer check is a literal string
          # compare against the token's "iss", not a reachability check.
          value: "http://10.9.21.236:8080/realms/platform"
        - name: KEYCLOAK_URL
          value: "http://keycloak.platform.svc.cluster.local:8080"
        - name: KEYCLOAK_ADMIN_USER
          valueFrom:
            secretKeyRef:
              name: platform-api-secrets
              key: keycloak-admin-username
        - name: KEYCLOAK_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: platform-api-secrets
              key: keycloak-admin-password
        - name: APP_PROMETHEUS_URL
          value: "http://monitoring-stack-kube-prom-prometheus.monitoring.svc.cluster.local:9090"
        - name: APP_ALERTMANAGER_URL
          value: "http://monitoring-stack-kube-prom-alertmanager.monitoring.svc.cluster.local:9093"
        - name: APP_KAFKA_BOOTSTRAP_SERVERS
          value: "my-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092"
        - name: APP_KAFKA_ENABLED
          value: "true"
        - name: APP_KUBERNETES_ENABLED
          value: "true"
---
apiVersion: v1
kind: Service
metadata:
  name: platform-api
  namespace: platform
spec:
  type: LoadBalancer
  selector:
    app: platform-api
  ports:
  - name: http
    port: 8082
    targetPort: 8082
