apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-web
  namespace: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: platform-web
  template:
    metadata:
      labels:
        app: platform-web
    spec:
      containers:
      - name: platform-web
        image: adelbettaieb/platform-web:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: platform-web
  namespace: platform
spec:
  type: LoadBalancer
  selector:
    app: platform-web
  ports:
  - port: 80
    targetPort: 80
