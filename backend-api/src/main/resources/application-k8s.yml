server:
  port: 8082

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres.platform.svc.cluster.local:5432/platformserverless}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: localhost
      port: 6379

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://10.9.21.236:8080/realms/platform}

app:
  kubernetes:
    enabled: true
    namespace: default
    knative-api-version: serving.knative.dev/v1

  keycloak:
    url: ${KEYCLOAK_URL:http://keycloak.platform.svc.cluster.local:8080}
    realm: platform
    admin-username: ${KEYCLOAK_ADMIN_USER:admin}
    admin-password: ${KEYCLOAK_ADMIN_PASSWORD}
    client-id: platform-web

  kafka:
    enabled: true
    bootstrap-servers: ${APP_KAFKA_BOOTSTRAP_SERVERS:my-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092}

  prometheus:
    url: ${APP_PROMETHEUS_URL:http://monitoring-stack-kube-prom-prometheus.monitoring.svc.cluster.local:9090}

  alertmanager:
    url: ${APP_ALERTMANAGER_URL:http://monitoring-stack-kube-prom-alertmanager.monitoring.svc.cluster.local:9093}

  cors:
    # platform-web: LoadBalancer external IP (10.9.21.238, port 80) AND its
    # auto-assigned NodePort (31088), reachable on any of the 3 nodes.
    # platform-admin: NodePort 30081, also reachable on any of the 3 nodes.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://10.9.21.238,http://10.9.21.223:30081,http://10.9.21.224:30081,http://10.9.21.225:30081,http://10.9.21.223:31088,http://10.9.21.224:31088,http://10.9.21.225:31088}

management:
  health:
    redis:
      enabled: false
    elasticsearch:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.platform: INFO
    org.springframework.security: INFO
